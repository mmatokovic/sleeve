<div class="mx-auto max-w-7xl space-y-8 px-4 py-16 text-center sm:px-6 lg:space-y-16 lg:px-8">
  <p>
    &copy; {{ now.Year }}
    {{- with site.Params.copyright }}
    <a href="{{ .url }}" rel="me noopener" target="_blank" class="text-gray-700 dark:text-gray-300 underline transition hover:text-gray-700/75 dark:hover:text-gray-300/75">{{ .name }}</a>
    {{- else }}
    {{ with site.Params.author.name }}{{ . }}{{ end }}
    {{- end }}
    {{- with site.Params.license }}
    · <a href="{{ .url }}" rel="license noopener" target="_blank" class="text-gray-700 dark:text-gray-300 underline transition hover:text-gray-700/75 dark:hover:text-gray-300/75">{{ .name }}</a>
    {{- end }}
    <br>
    {{ T "poweredBy" }}
    <a href="https://gohugo.io/" rel="noopener" target="_blank" class="text-gray-700 dark:text-gray-300 underline transition hover:text-gray-700/75 dark:hover:text-gray-300/75">Hugo</a>
    {{ T "and" }}
    <a href="https://github.com/mmatokovic/sleeve" rel="noopener" target="_blank" class="text-gray-700 dark:text-gray-300 underline transition hover:text-gray-700/75 dark:hover:text-gray-300/75">Sleeve</a>.
    {{- with partial "utils/analytics-id" . }}
    <br>
    <button type="button" data-consent="open" class="cursor-pointer text-gray-700 dark:text-gray-300 underline transition hover:text-gray-700/75 dark:hover:text-gray-300/75">{{ T "consentSettings" }}</button>
    {{- end }}
  </p>
</div>
<div x-data="{ show: false }" x-on:scroll.window="show = window.scrollY >= 1000" class="fixed right-8 bottom-8">
  <button
    type="button"
    x-show="show"
    x-cloak
    x-transition:enter="transform transition ease-out duration-300"
    x-transition:enter-start="translate-y-4 opacity-0"
    x-transition:enter-end="translate-y-0 opacity-100"
    x-transition:leave="transform transition ease-in duration-200"
    x-transition:leave-start="translate-y-0 opacity-100"
    x-transition:leave-end="translate-y-4 opacity-0"
    x-on:click="window.scrollTo({ top: 0, behavior: 'smooth' })"
    class="cursor-pointer rounded-full bg-white dark:bg-gray-900 p-2 shadow-lg motion-safe:animate-bounce">
    <span class="sr-only">{{ T "backToTop" }}</span>
    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="m11 7.825l-4.9 4.9q-.3.3-.7.288t-.7-.313q-.275-.3-.288-.7t.288-.7l6.6-6.6q.15-.15.325-.212T12 4.425q.2 0 .375.063t.325.212l6.6 6.6q.275.275.275.688t-.275.712q-.3.3-.713.3t-.712-.3L13 7.825V19q0 .425-.288.713T12 20q-.425 0-.713-.288T11 19V7.825Z"/>
    </svg>
  </button>
</div>
