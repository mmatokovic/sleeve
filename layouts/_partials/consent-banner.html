{{- with partial "utils/analytics-id" . }}
{{- $button := "cursor-pointer rounded-lg px-4 py-2 text-sm font-medium ring ring-blue-600 transition" }}
<section id="consent-banner" hidden aria-labelledby="consent-title" class="fixed inset-x-4 bottom-4 z-50 rounded-lg bg-white dark:bg-gray-800 p-4 shadow-lg ring ring-gray-900/10 dark:ring-white/10 sm:right-auto sm:max-w-md">
  <h2 id="consent-title" class="font-medium text-gray-900 dark:text-gray-100">{{ T "consentTitle" }}</h2>
  <p class="mt-1 text-sm text-gray-700 dark:text-gray-300">{{ T "consentText" }}</p>
  <div class="mt-3 flex gap-2">
    <button type="button" data-consent="granted" class="{{ $button }} bg-blue-600 text-blue-50 hover:bg-blue-600/75">{{ T "consentAccept" }}</button>
    <button type="button" data-consent="denied" class="{{ $button }} bg-white dark:bg-gray-800 text-blue-600 dark:text-blue-400 hover:bg-blue-50 dark:hover:bg-gray-700">{{ T "consentDecline" }}</button>
  </div>
</section>
{{- end }}
