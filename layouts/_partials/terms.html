{{- $page := .page }}
{{- $taxonomy := .taxonomy }}

{{- with $page.GetTerms $taxonomy }}
  {{- if eq $taxonomy "series" }}
  <p class="relative z-10 text-xs text-gray-500 dark:text-gray-400">
    {{ T "series" }}: <a href="{{ (index . 0).RelPermalink }}" class="font-medium underline hover:text-gray-700 dark:hover:text-gray-200">{{ (index . 0).LinkTitle }}</a>
  </p>
  {{- else }}
  <ul class="relative z-10 flex flex-wrap gap-1">
    {{- range . }}
    <li>
      <a href="{{ .RelPermalink }}" rel="tag" class="rounded-full bg-gray-200 dark:bg-gray-700 px-2.5 py-0.5 text-xs whitespace-nowrap text-gray-600 dark:text-gray-400 transition hover:bg-gray-300 dark:hover:bg-gray-600">#{{ .LinkTitle }}</a>
    </li>
    {{- end }}
  </ul>
  {{- end }}
{{- end }}
