{{ define "main" }}
<div>
  {{- with .Content }}
  <div class="prose dark:prose-invert max-w-none text-pretty lg:prose-xl">
    {{- . -}}
  </div>
  {{- end }}
  {{ partialCached "posts-search" . .Section .Lang }}
  <div data-search-paged>
    {{ partial "posts-template" . }}
    <div class="my-16">
      {{ partial "pagination" . }}
    </div>
  </div>
</div>
{{ end }}
