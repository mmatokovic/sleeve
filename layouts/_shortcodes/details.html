{{- $title := .Get "title" | default "" -}}
{{- $closed := eq (printf "%v" (.Get "closed")) "true" -}}

<details class="group mt-4 rounded-lg bg-neutral-50 p-2 last-of-type:mb-0"{{ if not $closed }} open{{ end }}>
  <summary class="flex cursor-pointer items-center rounded-sm p-1 transition-colors select-none before:mr-1 before:inline-block before:transition-transform before:content-['▸'] hover:bg-gray-100 group-open:before:rotate-90 rtl:before:rotate-180">
    <strong class="text-lg">{{ $title | .Page.RenderString }}</strong>
  </summary>
  <div class="overflow-hidden p-2">
    {{ .InnerDeindent | .Page.RenderString (dict "display" "block") }}
  </div>
</details>
