{{- $quote := printf `<blockquote%s>%s</blockquote>` (cond (isset .Attributes "cite") (printf ` cite="%s"` (.Attributes.cite | htmlEscape)) "") .Text }}
{{- with .Attributes.caption }}
<figure>
  {{ $quote | safeHTML }}
  <figcaption class="text-sm text-gray-500">{{ . | safeHTML }}</figcaption>
</figure>
{{- else }}
{{ $quote | safeHTML }}
{{- end }}
